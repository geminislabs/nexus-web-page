name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: https://npm.pkg.github.com
          scope: '@JesusCabrera84'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Prepare Vite env for SvelteKit
        run: |
          echo "VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://127.0.0.1:8100/api/v1}" >> "$GITHUB_ENV"
          echo "VITE_ADMIN_API_URL=${VITE_ADMIN_API_URL:-http://127.0.0.1:8100/api/v1}" >> "$GITHUB_ENV"
          echo "VITE_COMM_API_URL=${VITE_COMM_API_URL:-http://127.0.0.1:8000}" >> "$GITHUB_ENV"
          echo "VITE_COMPANY_URL=${VITE_COMPANY_URL:-http://127.0.0.1:5173}" >> "$GITHUB_ENV"
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL }}
          VITE_COMM_API_URL: ${{ vars.VITE_COMM_API_URL }}
          VITE_COMPANY_URL: ${{ vars.VITE_COMPANY_URL }}

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build application
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Audit dependencies
        run: npm run audit

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: https://npm.pkg.github.com
          scope: '@JesusCabrera84'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Prepare Vite env for SvelteKit
        run: |
          echo "VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://127.0.0.1:8100/api/v1}" >> "$GITHUB_ENV"
          echo "VITE_ADMIN_API_URL=${VITE_ADMIN_API_URL:-http://127.0.0.1:8100/api/v1}" >> "$GITHUB_ENV"
          echo "VITE_COMM_API_URL=${VITE_COMM_API_URL:-http://127.0.0.1:8000}" >> "$GITHUB_ENV"
          echo "VITE_COMPANY_URL=${VITE_COMPANY_URL:-http://127.0.0.1:5173}" >> "$GITHUB_ENV"
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ADMIN_API_URL: ${{ vars.VITE_ADMIN_API_URL }}
          VITE_COMM_API_URL: ${{ vars.VITE_COMM_API_URL }}
          VITE_COMPANY_URL: ${{ vars.VITE_COMPANY_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke e2e tests
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run test:e2e

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        run: bash scripts/gitleaks-scan.sh

      - name: Semgrep static analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/secrets

      - name: OSV dependency scan
        run: bash scripts/osv-scan.sh
