<!doctype html>
<html lang="es" class="h-full scroll-smooth antialiased">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" data-nexus-dynamic content="#020617" />
		<meta name="application-name" content="NEXUS" />
		<meta name="format-detection" content="telephone=no" />
		<script>
			(function () {
				try {
					var key = 'nexus-theme';
					var t = localStorage.getItem(key);
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.dataset.theme = t;
					document.documentElement.classList.toggle('dark', t === 'dark');
					var meta = document.querySelector('meta[name="theme-color"][data-nexus-dynamic]');
					if (meta) meta.setAttribute('content', t === 'dark' ? '#020617' : '#f8fafc');
				} catch (e) {
					/* ignore */
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body
		data-sveltekit-preload-data="hover"
		class="min-h-full bg-slate-50 text-slate-900 [color-scheme:dark_light] dark:bg-slate-950 dark:text-slate-100"
	>
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
